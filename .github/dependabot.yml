version: 2
updates:
  # One PR a week with all minor and patch updates; each major version gets its own PR.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  # The node base image in the Dockerfile. A new Node major is a manual decision.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Not here on purpose: the images in docker-compose.yml. Their version changes
  # migrate data and are done by hand; patch releases arrive with each deploy.
